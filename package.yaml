name: blog
version: 0.5.0.0
github: gislik/blog
license: BSD-3-Clause
author: "Gísli Kristjánsson"
maintainer: "gislik@hamstur.is"
copyright: "2026 Gísli Kristjánsson"

extra-source-files:
  - README.md

description: Please see the README on GitHub at <https://github.com/gislik/blog#readme>

dependencies:
  - base >= 4.7 && < 5

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

executables:
  blog:
    main: blog.hs
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - hakyll
      - containers
      - text
      - time
      - filepath
      - blaze-html
      - tagsoup
      - pandoc
